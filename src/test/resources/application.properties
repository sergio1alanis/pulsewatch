spring.datasource.url=jdbc:h2:mem:pulsewatch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
pulsewatch.probe.allow-loopback=true
pulsewatch.scheduler.enabled=false
pulsewatch.security.api-key=
pulsewatch.security.require-api-key=false
pulsewatch.security.rate-limit-per-minute=120
