spring.application.name=pulsewatch
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/pulsewatch}
spring.datasource.username=${DB_USERNAME:pulsewatch_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

pulsewatch.probe.allow-loopback=${PULSEWATCH_PROBE_ALLOW_LOOPBACK:false}
pulsewatch.scheduler.enabled=${PULSEWATCH_SCHEDULER_ENABLED:true}
pulsewatch.notifications.webhook-url=${PULSEWATCH_WEBHOOK_URL:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
